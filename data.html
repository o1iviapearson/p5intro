
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>A Week of Moods</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
  <script src="data.js" defer></script>

  <style>
    body {
      margin: 0;
      padding: 30px;
      background-color: white;
      color: #111;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 32px;
      font-weight: normal;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 24px;
      font-weight: normal;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    #visualization {
      width: 100%;
      max-width: 1000px;
      margin: 30px auto;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
      margin: auto;
    }

    .original-sketch {
      margin-top: 60px;
    }

    .original-sketch img {
      width: 800px;
      max-width: 100%;
      height: auto;
    }
  </style>

</head>

<body>

  <h1>A Week of Moods</h1>

  <p>
    A visualization of my mood and energy
    throughout the week.
  </p>

  <div id="visualization"></div>

  <section class="original-sketch">
    <h2>Original Drawing</h2>

    <img src="Mood.jpg"
         alt="My original hand-drawn mood visualization">
  </section>

</body>
</html>
